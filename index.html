<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studienverlauf Maschinenbau (MAB) - HTWG Konstanz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --htwg-teal: hwb(219 50% 11%); 
            --htwg-teal-light: rgba(20, 184, 166, 0.15);
            --htwg-teal-glow: rgba(20, 184, 166, 0.3);
            --bg-color: #0f172a;       
            --col-bg: #1e293b;         
            --card-bg: #334155;        
            --modal-bg: #0f172a;       
            --text-main: #f8fafc;      
            --text-muted: #cbd5e1;     
            --text-dim: #94a3b8;       
            --border-color: #475569;   
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; }

        header {
            background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px 40px; text-align: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }

        header h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 700; }
        header p { margin: 0; color: var(--htwg-teal); font-weight: 500; font-size: 15px; }

        .user-panel {
            position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; align-items: center;
        }

        .user-badge {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 13px; color: var(--htwg-teal); font-weight: 600;
        }

        .btn-small {
            background: var(--col-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .btn-small:hover { background: var(--htwg-teal); color: #000; border-color: var(--htwg-teal); }

        .controls { display: flex; gap: 15px; justify-content: center; align-items: center; margin-top: 20px; flex-wrap: wrap; }
        .search-box { padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: var(--text-main); width: 280px; outline: none; }
        .search-box:focus { border-color: var(--htwg-teal); box-shadow: 0 0 0 3px var(--htwg-teal-light); }
        .filter-btn { padding: 9px 18px; border-radius: 20px; background: var(--col-bg); border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer; }
        .filter-btn.active { background: var(--htwg-teal); color: #000; font-weight: 600; border-color: var(--htwg-teal); }

        .board { display: flex; overflow-x: auto; padding: 30px 40px; gap: 25px; align-items: flex-start; min-height: calc(100vh - 120px); }
        .semester-col { background-color: var(--col-bg); border: 1px solid var(--border-color); border-radius: 12px; min-width: 340px; max-width: 340px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        
        .sem-header { text-align: center; border-bottom: 2px solid var(--htwg-teal); padding-bottom: 10px; margin-bottom: 5px; }
        .sem-header h2 { margin: 0; font-size: 18px; color: var(--text-main); }
        .avg-badge { display: inline-block; margin-top: 8px; background: rgba(20, 184, 166, 0.15); color: var(--htwg-teal); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid rgba(20, 184, 166, 0.3); }

        .module-card { background-color: var(--card-bg); border-left: 4px solid var(--htwg-teal); border-radius: 8px; padding: 18px; cursor: pointer; transition: all 0.25s ease; position: relative; }
        .module-card:hover { transform: translateY(-4px); background-color: #3f4f66; box-shadow: 0 12px 20px -5px var(--htwg-teal-glow); }
        
        .module-card.passed { border-left-color: #22c55e; background-image: linear-gradient(to right, rgba(34, 197, 94, 0.1), transparent); }
        .module-card.passed .mod-id { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        
        .grade-badge { position: absolute; top: 18px; right: 18px; background: #0f172a; border: 1px solid #22c55e; color: #4ade80; font-weight: bold; font-size: 12px; padding: 4px 8px; border-radius: 6px; }

        .mod-id { font-size: 12px; font-weight: 700; margin-bottom: 12px; display: inline-block; background: var(--htwg-teal-light); padding: 4px 10px; border-radius: 6px; color: var(--htwg-teal); }
        .mod-title { font-size: 15px; font-weight: 600; margin: 0 0 12px 0; line-height: 1.4; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--modal-bg); width: 90%; max-width: 850px; max-height: 90vh; display: flex; flex-direction: column; border-radius: 16px; border: 1px solid var(--border-color); }
        
        .modal-header { padding: 25px; border-bottom: 2px solid var(--htwg-teal); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 30px; overflow-y: auto; line-height: 1.7; font-size: 15px; color: var(--text-muted); }
        .close-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }

        /* Login Modal specific */
        .login-box { max-width: 400px; padding: 40px; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 12px; background: var(--htwg-teal); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .login-btn:hover { background: #109888; }
        .toggle-link { color: var(--htwg-teal); font-size: 13px; cursor: pointer; text-decoration: underline; }

        /* Grade Input */
        .action-area { display: flex; gap: 15px; margin-bottom: 25px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); align-items: center;}
        .pass-btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid #22c55e; background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .pass-btn.is-passed { background: #22c55e; color: #000; }
        .grade-input-wrapper { display: none; flex-direction: column; width: 120px; }
        .grade-input-wrapper label { font-size: 12px; color: var(--htwg-teal); margin-bottom: 4px; font-weight: bold; }
        .grade-input { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: white; width: 100%; box-sizing: border-box; }

    </style>
</head>
<body>

    <header>
        <div class="user-panel" id="user-panel" style="display:none;">
            <span class="user-badge" id="current-username">User</span>
            <button class="btn-small" onclick="logout()">Logout</button>
            <button class="btn-small" onclick="exportData()">💾 Backup laden</button>
            <button class="btn-small" onclick="document.getElementById('import-file').click()">📂 Backup einspielen</button>
            <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importData(event)">
        </div>

        <h1>Studienverlauf Maschinenbau (MAB)</h1>
        <p>HTWG Konstanz | Nach SPO Nr. 2</p>

        <div class="controls">
            <input type="text" id="search-input" class="search-box" placeholder="Suche (Titel, Prof, Kürzel)...">
            <button class="filter-btn active" data-filter="ALL">Alle</button>
            <button class="filter-btn" data-filter="PM">Pflicht (PM)</button>
            <button class="filter-btn" data-filter="WPM">Wahlpflicht (WPM)</button>
        </div>
    </header>

    <div class="board" id="board"></div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="login-overlay">
        <div class="modal-content login-box">
            <h2 id="login-title">Login</h2>
            <p style="font-size:13px; color:var(--text-dim); margin-bottom:20px;">Daten werden lokal im Browser gespeichert.</p>
            <input type="text" id="username" class="login-input" placeholder="Benutzername">
            <input type="password" id="password" class="login-input" placeholder="Passwort">
            <button class="login-btn" id="submit-login" onclick="handleAuth()">Einloggen</button>
            <span class="toggle-link" onclick="toggleAuthMode()" id="auth-toggle">Noch keinen Account? Registrieren</span>
            <div id="auth-error" style="color:#ef4444; font-size:13px; margin-top:10px; display:none;"></div>
        </div>
    </div>

    <!-- Module Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="m-title" style="margin:0;">Modultitel</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                
                <!-- Action Area: Pass & Grade -->
                <div class="action-area">
                    <button id="toggle-pass-btn" class="pass-btn" onclick="togglePass()">Als bestanden markieren</button>
                    <div class="grade-input-wrapper" id="grade-wrapper">
                        <label for="mod-grade">Note (z.B. 1.3)</label>
                        <input type="number" id="mod-grade" class="grade-input" step="0.1" min="1.0" max="5.0" placeholder="-" onchange="saveGrade(this.value)">
                    </div>
                </div>

                <div style="font-size:14px; background:rgba(0,0,0,0.2); padding:15px; border-radius:8px; margin-bottom:20px;">
                    <strong style="color:var(--htwg-teal)">Prüfung:</strong> <span id="m-pruefung"></span><br>
                    <strong style="color:var(--htwg-teal)">ECTS:</strong> <span id="m-ects"></span> | <strong style="color:var(--htwg-teal)">Dozent:</strong> <span id="m-prof"></span>
                </div>

                <h3 style="color:var(--htwg-teal); border-bottom:1px solid var(--border-color); padding-bottom:5px;">Voraussetzungen</h3>
                <p id="m-voraussetzung" style="font-size:14px;"></p>
            </div>
        </div>
    </div>

    <script>
        // === DATEN & STATE ===
        let MODULES = {};
        let SEMESTER_STRUKTUR = [];
        
        // Multi-User DB im localStorage
        let usersDB = JSON.parse(localStorage.getItem('mab_usersDB')) || {};
        let currentUser = null; // Aktuell eingeloggter User
        
        let currentSearch = "";
        let currentFilter = "ALL";
        let currentModalId = null;
        let isRegisterMode = false;

        // === INIT ===
        async function init() {
            try {
                const response = await fetch('module.json');
                const data = await response.json();
                MODULES = data.MODULES;
                SEMESTER_STRUKTUR = data.SEMESTER_STRUKTUR;
                
                checkLoginStatus();
            } catch (error) {
                document.getElementById('board').innerHTML = `<h2 style="color:red; text-align:center;">Fehler: module.json nicht gefunden! (Läuft die Seite über einen Server?)</h2>`;
            }
        }

        // === AUTHENTIFIZIERUNG ===
        function checkLoginStatus() {
            const savedUser = sessionStorage.getItem('mab_activeUser');
            if(savedUser && usersDB[savedUser]) {
                currentUser = savedUser;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('user-panel').style.display = 'flex';
                document.getElementById('current-username').innerText = currentUser;
                renderBoard();
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('login-title').innerText = isRegisterMode ? "Registrieren" : "Login";
            document.getElementById('submit-login').innerText = isRegisterMode ? "Account erstellen" : "Einloggen";
            document.getElementById('auth-toggle').innerText = isRegisterMode ? "Bereits einen Account? Einloggen" : "Noch keinen Account? Registrieren";
            document.getElementById('auth-error').style.display = 'none';
        }

        function handleAuth() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('auth-error');

            if(!u || !p) { err.innerText = "Bitte Felder ausfüllen!"; err.style.display = 'block'; return; }

            if(isRegisterMode) {
                if(usersDB[u]) { err.innerText = "Benutzername existiert bereits!"; err.style.display = 'block'; return; }
                // Neuen User anlegen
                usersDB[u] = { password: p, passed: [], grades: {} };
                saveDB();
            } else {
                if(!usersDB[u] || usersDB[u].password !== p) { err.innerText = "Falscher Name oder Passwort!"; err.style.display = 'block'; return; }
            }

            // Login erfolgreich
            sessionStorage.setItem('mab_activeUser', u);
            document.getElementById('password').value = "";
            checkLoginStatus();
        }

        function logout() {
            sessionStorage.removeItem('mab_activeUser');
            currentUser = null;
            document.getElementById('user-panel').style.display = 'none';
            document.getElementById('board').innerHTML = '';
            document.getElementById('login-overlay').style.display = 'flex';
        }

        function saveDB() {
            localStorage.setItem('mab_usersDB', JSON.stringify(usersDB));
        }

        // === JSON EXPORT / IMPORT ===
        function exportData() {
            if(!currentUser) return;
            const userData = usersDB[currentUser];
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `mab_backup_${currentUser}.json`);
            dlAnchorElem.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if(!file || !currentUser) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if(importedData.passed && importedData.grades) {
                        usersDB[currentUser].passed = importedData.passed;
                        usersDB[currentUser].grades = importedData.grades;
                        saveDB();
                        renderBoard();
                        alert("Backup erfolgreich geladen!");
                    } else { alert("Ungültige Backup-Datei."); }
                } catch(err) { alert("Fehler beim Lesen der Datei."); }
            };
            reader.readAsText(file);
        }

        // === RENDER LOGIK ===
        function renderBoard() {
            if(!currentUser) return;
            const board = document.getElementById('board');
            board.innerHTML = '';
            const userProfile = usersDB[currentUser];
            
            SEMESTER_STRUKTUR.forEach(sem => {
                const col = document.createElement('div');
                col.className = 'semester-col';
                
                // Notendurchschnitt berechnen (ECTS gewichtet)
                let sumGradesECTS = 0;
                let sumECTS = 0;

                sem.module.forEach(id => {
                    const mod = MODULES[id];
                    if(userProfile.passed.includes(id) && userProfile.grades[id]) {
                        const grade = parseFloat(userProfile.grades[id]);
                        if(!isNaN(grade)) {
                            sumGradesECTS += (grade * mod.ects);
                            sumECTS += mod.ects;
                        }
                    }
                });

                let avgStr = sumECTS > 0 ? (sumGradesECTS / sumECTS).toFixed(2) : "-";
                
                col.innerHTML = `
                    <div class="sem-header">
                        <h2>${sem.titel}</h2>
                        <span class="avg-badge">Ø Note: ${avgStr}</span>
                    </div>
                `;

                sem.module.forEach(id => {
                    const mod = MODULES[id];
                    if(!mod) return;

                    if(currentFilter === 'PM' && !mod.typ.startsWith('PM')) return;
                    if(currentFilter === 'WPM' && !mod.typ.startsWith('WPM')) return;

                    const searchText = `${mod.titel} ${mod.kuerzel} ${mod.koordination}`.toLowerCase();
                    if(currentSearch && !searchText.includes(currentSearch)) return;

                    const isPassed = userProfile.passed.includes(id);
                    const grade = userProfile.grades[id];

                    const card = document.createElement('div');
                    card.className = `module-card ${isPassed ? 'passed' : ''}`;
                    card.onclick = () => openModal(id);

                    card.innerHTML = `
                        <span class="mod-id">${mod.kuerzel} | ${mod.ects} ECTS</span>
                        ${grade ? `<span class="grade-badge">${grade}</span>` : ''}
                        <h3 class="mod-title">${mod.titel}</h3>
                        <div style="font-size:12px; color:var(--text-muted)">${mod.typ} | ${mod.koordination.split(',')[0]}</div>
                    `;
                    col.appendChild(card);
                });

                board.appendChild(col);
            });
        }

        // === MODAL & INTERAKTION ===
        function openModal(id) {
            currentModalId = id;
            const mod = MODULES[id];
            const userProfile = usersDB[currentUser];
            
            document.getElementById('m-title').innerText = `${mod.kuerzel}: ${mod.titel}`;
            document.getElementById('m-prof').innerText = mod.koordination;
            document.getElementById('m-ects').innerText = mod.ects;
            document.getElementById('m-pruefung').innerText = mod.pruefung.modulpruefung || mod.pruefung.modulteilpruefung || "Keine Prüfung";
            document.getElementById('m-voraussetzung').innerText = mod.voraussetzung;
            
            // Bestanden Button
            const passBtn = document.getElementById('toggle-pass-btn');
            if(userProfile.passed.includes(id)) {
                passBtn.classList.add('is-passed');
                passBtn.innerText = "✓ Bestanden (Aufheben)";
            } else {
                passBtn.classList.remove('is-passed');
                passBtn.innerText = "Als bestanden markieren";
            }

            // Noten-Input (Nur anzeigen, wenn es eine Klausur/Mündliche Prüfung etc. gibt - hier vereinfacht: immer zeigen wenn bestanden)
            const gradeWrapper = document.getElementById('grade-wrapper');
            const gradeInput = document.getElementById('mod-grade');
            
            if(userProfile.passed.includes(id)) {
                gradeWrapper.style.display = 'flex';
                gradeInput.value = userProfile.grades[id] || "";
            } else {
                gradeWrapper.style.display = 'none';
                gradeInput.value = "";
            }

            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function togglePass() {
            const userProfile = usersDB[currentUser];
            if(userProfile.passed.includes(currentModalId)) {
                userProfile.passed = userProfile.passed.filter(id => id !== currentModalId);
                delete userProfile.grades[currentModalId]; // Note löschen, wenn nicht mehr bestanden
            } else {
                userProfile.passed.push(currentModalId);
            }
            saveDB();
            openModal(currentModalId); // Modal refreshen
            renderBoard(); // Board refreshen für Notendurchschnitt
        }

        function saveGrade(val) {
            if(val && val >= 1.0 && val <= 5.0) {
                usersDB[currentUser].grades[currentModalId] = parseFloat(val).toFixed(1);
            } else {
                delete usersDB[currentUser].grades[currentModalId];
            }
            saveDB();
            renderBoard();
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        // Filter / Search Events
        document.getElementById('search-input').addEventListener('input', (e) => { currentSearch = e.target.value.toLowerCase(); renderBoard(); });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderBoard();
            });
        });

        window.onclick = (e) => { if(e.target === document.getElementById('modal-overlay')) closeModal(); }

        init();
    </script>
</body>
</html>
